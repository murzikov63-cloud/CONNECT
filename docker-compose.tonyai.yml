# Запуск на TONYAI — дополнение к docker-compose.yml.
#
# С ноября 2026 сервис живёт на нашей машине, а не на отдельном сервере:
# пользуемся мессенджерами редко, и платить за целый сервер незачем.
# Когда начнём работать активно — вернём на отдельный сервер, там всё
# по-прежнему описано в docker-compose.yml.
#
# Отличие одно: наружу выходим не своими портами 80/443, а через
# Cloudflare Tunnel, который уже обслуживает остальные наши сервисы.
# Туннель приходит на 127.0.0.1:3400 обычным HTTP.
#
# Запускать через deploy/tonyai.sh — он подставляет оба файла.

services:
  caddy:
    ports: !override
      - "127.0.0.1:3400:80"
    volumes: !override
      - ./caddy/Caddyfile.tonyai:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
