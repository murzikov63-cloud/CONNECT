services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Настройки под сервер с 2 ГБ: по умолчанию Postgres рассчитывает
    # на куда больший объём и в тесноте начинает свопиться.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=40
      -c wal_compression=on
    mem_limit: 512m
    # База умирает последней: без неё сервис всё равно бесполезен.
    oom_score_adj: -500
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction принципиально: очередь не должна молча терять задания.
    # Если упрётся в потолок — придёт алерт, а не тихая пропажа сообщений.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 96mb
      --maxmemory-policy noeviction
    mem_limit: 128m
    oom_score_adj: -300
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    # Потолок кучи Node ниже лимита контейнера: сборщик мусора успеет
    # среагировать раньше, чем система решит убить процесс.
    environment:
      NODE_OPTIONS: --max-old-space-size=640
    mem_limit: 768m
    # Если памяти всё-таки не хватит, первым отстреливается сервис:
    # он поднимется сам и переподключится, а база и очередь уцелеют.
    oom_score_adj: 200
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      max-bridge: { condition: service_started }
    volumes:
      - media:/app/media
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Мессенджер MAX. Отдельный процесс на Python: рабочая библиотека
  # для личного аккаунта MAX существует только там. Наружу не смотрит,
  # разговаривает только с app внутри докер-сети.
  max-bridge:
    build: ./max-bridge
    restart: unless-stopped
    environment:
      APP_URL: http://app:3000
      BRIDGE_SECRET: ${BRIDGE_SECRET}
      MEDIA_DIR: /app/media
      SESSION_DIR: /data
    volumes:
      - media:/app/media
      - maxsessions:/data
    mem_limit: 320m
    oom_score_adj: 300
    expose:
      - "8090"

  # Админка. Lovable собирает её как приложение с серверным рендерингом,
  # поэтому это отдельный процесс, а не набор файлов. Собирается на TONYAI,
  # сюда приезжает уже готовой — дроплету сборку не доверяем, у него одно ядро.
  admin:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    command: ["node", ".output/server/index.mjs"]
    environment:
      PORT: "3000"
      NODE_ENV: production
    volumes:
      - ./admin-dist:/app/.output:ro
    mem_limit: 256m
    # Админка — не самое важное: если памяти не хватит, пусть падает она,
    # а не переписка с клиентами.
    oom_score_adj: 400
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/origin:/etc/caddy/origin:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
      - admin

volumes:
  maxsessions:
  pgdata:
  redisdata:
  media:
  caddydata:
  caddyconfig:
